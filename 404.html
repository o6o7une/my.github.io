<main class="wrap err">
<div class="big" role="img" aria-label="Error 404">404</div>
<p class="lab">Error 404</p>
<h1>Page not found</h1>
<p class="lede">This address doesn’t exist on this server. Check the spelling of the URL, or start from the service directory.</p>
<div class="pg" aria-hidden="true"><i id="pb"></i></div>
<p id="cd"></p>
<div class="act"><a class="btn fill" href="/">Go to service directory</a><button class="btn" id="stay" type="button">Stay on this page</button></div>
</main>
<script>
(function(){
var n=10,home="/",cd=document.getElementById("cd"),pb=document.getElementById("pb");
function say(){cd.textContent="Returning to the service directory in "+n+" second"+(n===1?"":"s")+"."}
say();
requestAnimationFrame(function(){pb.style.transition="width 10s linear";pb.style.width="0"});
var t=setInterval(function(){n--;if(n<=0){clearInterval(t);location.href=home;return}say()},1000);
document.getElementById("stay").onclick=function(){clearInterval(t);pb.style.transition="none";pb.style.width="100%";cd.textContent="Automatic redirect cancelled."};
var r=document.getElementById("retry");if(r)r.onclick=function(){location.reload()};
})();
</script>

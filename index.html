<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0B2545"><title>Service Directory - Meson Systematics</title><meta name="description" content="Directory of the services run by Meson Systematics, grouped by function, server and domain."><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&display=swap"><style>
:root{color-scheme:light dark;--bg:#F3F5F9;--sf:#fff;--ink:#0F1B2D;--ink2:#51607A;--ln:#D8DEE8;--navy:#0B2545;--acc:#0B4EA2;--gold:#B58A2A;--shadow:0 8px 24px rgba(11,37,69,.12)}
@media(prefers-color-scheme:dark){:root{--bg:#0D1520;--sf:#142033;--ink:#E8EDF5;--ink2:#9AA8BF;--ln:#26344B;--acc:#2F6FDB;--gold:#D4A94A;--shadow:0 8px 24px rgba(0,0,0,.4)}}
*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--ink);font:400 16px/1.55 "IBM Plex Sans","Segoe UI","Helvetica Neue",Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.wrap{width:100%;max-width:1160px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.top{background:var(--navy);color:#fff}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px;text-decoration:none}
.mk{display:grid;place-items:center;width:32px;height:32px;border-radius:4px;background:#fff;color:var(--navy);font:600 18px/1 "IBM Plex Serif",Georgia,serif}
.top a.ad{font-size:13px;color:#C9D5E8;text-underline-offset:3px}
.top a.ad:hover{color:#fff}
h1,h2{font-family:"IBM Plex Serif",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:-.01em;line-height:1.15}
.btn{display:inline-flex;align-items:center;justify-content:center;height:44px;padding:0 24px;border:1px solid var(--acc);border-radius:4px;background:none;color:var(--acc);font-family:inherit;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
.btn.fill{background:var(--acc);color:#fff}
.btn.fill:hover{filter:brightness(1.1)}
footer{border-top:1px solid var(--ln);margin-top:96px;padding-top:24px;padding-bottom:40px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between}
footer a{color:var(--ink);text-underline-offset:3px}

.hero{background:var(--navy);color:#fff;padding:56px 0 88px}
.hero h1{font-size:clamp(36px,5vw,56px);margin-bottom:16px}
.hero .lede{max-width:60ch;font-size:18px;color:#C9D5E8}
.stats{display:flex;flex-wrap:wrap;gap:24px 0;margin-top:40px}
.stats div{padding-right:40px;margin-right:40px;border-right:1px solid rgba(255,255,255,.22)}
.stats div:last-child{border:0;margin:0;padding:0}
.stats b{display:block;font:600 36px/1 "IBM Plex Serif",Georgia,serif}
.stats span{font-size:13px;color:#C9D5E8}
.panel{position:relative;margin-top:-32px;display:flex;flex-wrap:wrap;gap:16px 32px;align-items:center;padding:16px 20px;background:var(--sf);border:1px solid var(--ln);border-radius:8px;box-shadow:var(--shadow)}
.search{flex:1 1 280px;display:flex;align-items:center;gap:12px;height:48px;padding:0 16px;border:1px solid var(--ln);border-radius:4px;background:var(--bg)}
.search:focus-within{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:inherit;font:inherit}
.search svg{flex:none;fill:none;stroke:var(--ink2);stroke-width:2}
.grp{display:flex;align-items:center;gap:16px}
.lb{font-size:13px;font-weight:600;color:var(--ink2)}
.tabs{display:flex;gap:4px}
.tabs button{height:44px;padding:0 14px;border:0;border-bottom:3px solid transparent;background:none;color:var(--ink2);font:inherit;font-size:15px;font-weight:500;cursor:pointer}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-pressed=true]{color:var(--ink);font-weight:600;border-bottom-color:var(--gold)}
.dk{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.dk input{width:18px;height:18px;accent-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0 8px}
.chips button{height:36px;padding:0 14px;border:1px solid var(--ln);border-radius:4px;background:var(--sf);color:var(--ink);font:inherit;font-size:14px;cursor:pointer}
.chips button:hover{border-color:var(--acc)}
.chips button span{margin-left:4px;color:var(--ink2);font-size:12px}
.chips button.z{opacity:.5}
.chips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff;font-weight:600}
.chips button[aria-pressed=true] span{color:#C9D5E8}
#sum{font-size:13px;color:var(--ink2);margin:16px 0 8px}
section{margin-top:40px}
.gh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:16px}
.gh::before{content:none}
.gh h2{font-size:26px}
.gh h2::before{content:"";display:block;width:40px;height:3px;margin-bottom:12px;background:var(--gold)}
.gh p{font-size:14px;color:var(--ink2);margin-top:4px}
.gn{font-size:13px;color:var(--ink2);white-space:nowrap}
.tbl{background:var(--sf);border:1px solid var(--ln);border-radius:8px;overflow:hidden}
.th,.r{display:grid;grid-template-columns:minmax(0,2.4fr) minmax(0,1.3fr) minmax(0,1.3fr) 20px;gap:16px;align-items:center;padding:0 20px}
.th{height:40px;background:color-mix(in srgb,var(--navy) 6%,var(--sf));border-bottom:1px solid var(--ln);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.r{min-height:64px;padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--ln);text-decoration:none}
.r:last-child{border-bottom:0}
.r:hover{background:color-mix(in srgb,var(--acc) 6%,transparent)}
.c1{display:flex;align-items:center;gap:14px;min-width:0}
.tile{position:relative;flex:none;display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--ln);border-radius:6px;background:#fff;color:#0B2545;font-weight:600}
.tile img{position:absolute;inset:7px;width:24px;height:24px;object-fit:contain}
.tile.ok b{visibility:hidden}
.tx{display:flex;flex-direction:column;min-width:0}
.t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c2,.c3{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c3{color:var(--ink2)}
.c2 em{margin-left:8px;padding:1px 6px;border:1px solid var(--ln);border-radius:3px;font-size:11px;font-style:normal;color:var(--ink2)}
.ar{color:var(--acc);font-weight:600;text-align:right}
.empty{padding:48px 0}
.empty h2{font-size:24px;margin-bottom:8px}
.empty p{color:var(--ink2);margin-bottom:24px}
@media(max-width:720px){.th{display:none}.r{grid-template-columns:minmax(0,1fr) 20px}.c2,.c3{display:none}.stats div{padding-right:24px;margin-right:24px}.grp{flex-wrap:wrap}}
</style>

:root{color-scheme:light dark;--bg:#F7F7FA;--sf:#fff;--ink:#1B1C1F;--ink2:#5D616B;--ln:#DADCE2;--red:#D32F2F;--yel:#E5A100;--blu:#1A56DB;--on:#fff}

*{box-sizing:border-box;margin:0}
html{background:var(--bg);color:var(--ink);font:400 16px/1.5 "Helvetica Neue",Helvetica,Arial,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;min-height:100vh}
main{flex:1}
a{color:inherit}
:focus-visible{outline:2px solid var(--blu);outline-offset:2px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px)}
.bar{display:flex;align-items:center;height:64px;border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;font-size:14px;text-decoration:none}
.mark{display:flex;gap:4px}
.mark i{display:block;width:12px;height:12px}
.mark i:nth-child(1){background:var(--red);border-radius:50%}
.mark i:nth-child(2){background:var(--yel)}
.mark i:nth-child(3){background:var(--blu);clip-path:polygon(50% 0,100% 100%,0 100%)}
h1{font-weight:600;letter-spacing:-.02em;line-height:1.1}
.lede{color:var(--ink2);max-width:56ch}
.btn{display:inline-flex;align-items:center;justify-content:center;height:40px;padding:0 24px;border:1px solid var(--ln);border-radius:20px;background:none;color:var(--ink);font-family:inherit;font-size:14px;font-weight:600;text-decoration:none;cursor:pointer}
.btn:hover{background:color-mix(in srgb,var(--blu) 8%,transparent)}
.btn.fill{background:var(--blu);border-color:var(--blu);color:var(--on)}
.btn.fill:hover{filter:brightness(1.08)}
footer{border-top:1px solid var(--ln);margin-top:96px;padding-top:24px;padding-bottom:40px;font-size:13px;color:var(--ink2);display:flex;flex-wrap:wrap;gap:8px 32px;justify-content:space-between}
footer a{color:var(--ink);text-underline-offset:3px}

.hero{font-size:clamp(40px,7vw,72px);letter-spacing:-.03em;line-height:1;margin:64px 0 16px}
.lede{font-size:18px}
.tools{display:flex;flex-wrap:wrap;gap:16px 24px;align-items:center;margin:40px 0 16px}
.search{flex:1 1 280px;max-width:440px;display:flex;align-items:center;gap:12px;height:48px;padding:0 20px;border-radius:24px;background:var(--sf);border:1px solid var(--ln)}
.search:focus-within{border-color:var(--blu);box-shadow:0 0 0 1px var(--blu)}
.search input{flex:1;min-width:0;border:0;outline:0;background:none;color:inherit;font:inherit}
.search svg{flex:none;fill:none;stroke:var(--ink2);stroke-width:2}
.lb{font-size:13px;color:var(--ink2);margin-right:-8px}
.seg{display:flex;height:40px;border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.seg button{padding:0 18px;border:0;border-left:1px solid var(--ln);background:none;color:inherit;font-family:inherit;font-size:14px;cursor:pointer}
.seg button:first-child{border-left:0}
.seg button:hover,.chip:hover{background:color-mix(in srgb,var(--blu) 8%,transparent)}
.seg button[aria-pressed=true],.chip[aria-pressed=true]{background:color-mix(in srgb,var(--blu) 16%,transparent);font-weight:600}
.chip{height:32px;padding:0 16px;border:1px solid var(--ln);border-radius:8px;background:none;color:inherit;font-family:inherit;font-size:14px;cursor:pointer}
.chip[aria-pressed=true]::before{content:"\2713\00a0"}
#sum{font-size:13px;color:var(--ink2);margin-bottom:32px}
.main{display:grid;grid-template-columns:232px 1fr;gap:48px;align-items:start}
.rail{position:sticky;top:16px;display:flex;flex-direction:column}
.rail button{display:flex;align-items:center;gap:12px;width:100%;height:48px;padding:0 16px;border:0;border-radius:24px;background:none;color:inherit;font-family:inherit;font-size:14px;text-align:left;cursor:pointer}
.rail button:hover{background:color-mix(in srgb,var(--blu) 8%,transparent)}
.rail button[aria-pressed=true]{background:color-mix(in srgb,var(--blu) 16%,transparent);font-weight:600}
.rail button.z{opacity:.45}
.rail .nm{flex:1}
.rail .ct{font-size:12px;color:var(--ink2)}
.rail svg{flex:none}
section{margin-bottom:56px}
.gh{display:flex;align-items:baseline;gap:16px;border-top:2px solid var(--ink);padding-top:16px;margin-bottom:8px}
.gh h2{font-size:24px;font-weight:600;letter-spacing:-.01em}
.gh .gs{flex:1;font-size:13px;color:var(--ink2)}
.gh .gn{font-size:13px;color:var(--ink2)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));column-gap:32px}
.it{display:flex;align-items:center;gap:16px;min-height:64px;padding:12px 8px;border-bottom:1px solid var(--ln);border-radius:4px;text-decoration:none}
.it:hover{background:color-mix(in srgb,var(--blu) 7%,transparent)}
.tile{position:relative;flex:none;display:grid;place-items:center;width:40px;height:40px;border-radius:8px;background:#fff;border:1px solid var(--ln);color:#1B1C1F;font-weight:600}
.tile img{position:absolute;inset:6px;width:28px;height:28px;object-fit:contain}
.tile.ok b{visibility:hidden}
.tx{flex:1;min-width:0;display:flex;flex-direction:column}
.t{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{flex:none;max-width:40%;font-size:12px;line-height:1.4;color:var(--ink2);text-align:right}
.empty{padding:24px 0}
.empty h2{font-size:24px;margin-bottom:8px}
.empty p{color:var(--ink2);margin-bottom:24px}
@media(max-width:880px){.main{grid-template-columns:1fr;gap:24px}.rail{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:8px}.rail button{width:auto;flex:none;height:40px;border:1px solid var(--ln)}}
